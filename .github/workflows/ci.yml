name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]

    - name: Run Python linting
      run: |
        # Lint everything we ship, not just the service package. The CLI client
        # and SDK were previously unlinted, so real errors (e.g. an unused
        # variable in `adapter.py`) sat on main without ever failing a build.
        ruff check ciris_manager/ ciris_manager_client/ ciris_manager_sdk/ tests/
        ruff format --check ciris_manager/ ciris_manager_client/ ciris_manager_sdk/ tests/

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build and test TypeScript SDK
      run: |
        cd sdk/typescript/packages/cirismanager-sdk
        npm ci
        npm run build
        npm run build:browser
        npm test

    - name: Run type checking
      run: |
        mypy ciris_manager/

    - name: Run tests
      run: |
        echo "Running tests with python -m pytest..."
        python -m pytest tests/ -n 4 -v --cov=ciris_manager --cov-report=term-missing

    # Parallel runs distribute tests across worker processes, which can hide
    # order dependence: a test that pollutes global state and a test that trips
    # over it may simply land on different workers. That is exactly what
    # happened with CIRIS_DEPLOY_TOKEN leaking from test_cd_api_endpoints into
    # test_deployment_tokens - green under `-n 4`, red in a serial run.
    # `--dist loadfile` + a single worker forces a deterministic serial order so
    # cross-test contamination fails the build instead of hiding.
    - name: Run tests serially (isolation check)
      run: |
        python -m pytest tests/ -p no:cacheprovider -q --dist loadfile -n 1

  # Docker build removed - deployment via git clone instead

  # SDK can be published separately when needed
  # The Python API is the primary interface
